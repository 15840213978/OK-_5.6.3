name: Build OK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Python 3.10（Chaquopy 需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译全部 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 查看生成的 APK
        run: find app/build/outputs/apk -name "*.apk"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OK-5.6.3-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.6.3-build-${{ github.run_number }}
          name: OK影视 5.6.3 自动构建 #${{ github.run_number }}
          body: |
            由 GitHub Actions 自动构建。

            提交：${{ github.sha }}
            分支：${{ github.ref_name }}

            包含全部 Release 变体：
            - Mobile ARM64 / ARMv7
            - Leanback ARM64 / ARMv7
          files: |
            app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
