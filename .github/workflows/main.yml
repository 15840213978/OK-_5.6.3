name: OK影视 ARM64 全版本自动发布

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # 拉取源码
      - name: 拉取源码
        uses: actions/checkout@v4


      # JDK
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # Python（Chaquopy需要）
      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # Android SDK
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3


      # 编译所有版本
      - name: 编译全部版本 APK
        run: |
          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease

          ./gradlew assembleLeanbackArm64_v8aRelease

          ./gradlew assembleLeanbackArmeabi_v7aRelease


      # 查看生成文件
      - name: 查看 APK
        run: |
          find app/build/outputs/apk -name "*.apk"


      # 发布 Release
      - name: 发布 APK Release
        uses: softprops/action-gh-release@v2
        with:

          tag_name: v5.6.3-build-${{ github.run_number }}

          name: OK影视 5.6.3 自动构建版

          body: |
            自动编译发布

            包含：
            - Mobile Release
            - Leanback ARM64 TV
            - ARMv7版本

          files: |
            app/build/outputs/apk/**/*.apk

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
